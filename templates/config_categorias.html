{% extends "base.html" %}
{% block title %}Categorias · HUB-J FLUX{% endblock %}
{% block content %}
<div class="content" style="max-width:900px;margin:0 auto">
  <header class="panel-head">
    <h1>Categorias</h1>
    <p><a href="{{ url_for('config.index') }}" class="btn btn-ghost" style="padding:4px 10px;font-size:12px">← Configurações</a></p>
  </header>

  <h3>Nova categoria</h3>
  <form method="post" action="{{ url_for('config.nova_categoria') }}" class="filters" style="flex-wrap:wrap;align-items:flex-end">
    <div><label style="display:block;font-size:11px;color:var(--graphite)">Nome</label>
      <input name="nome" required style="padding:10px 14px;border:1px solid var(--line);border-radius:8px"></div>
    <div><label style="display:block;font-size:11px;color:var(--graphite)">Tipo</label>
      <select name="tipo" style="padding:10px 14px;border:1px solid var(--line);border-radius:8px">
        <option value="despesa">Despesa</option><option value="receita">Receita</option><option value="ambos">Ambos</option>
      </select></div>
    <div style="flex:1;min-width:200px"><label style="display:block;font-size:11px;color:var(--graphite)">Descrição (opcional)</label>
      <input name="descricao" style="width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px"></div>
    <div><label style="display:block;font-size:11px;color:var(--graphite)">Palavras-chave (opcional)</label>
      <input name="palavras_chave" placeholder="ex: uber, 99, taxi" style="padding:10px 14px;border:1px solid var(--line);border-radius:8px"></div>
    <button type="submit" class="btn btn-primary">Criar</button>
  </form>

  <div class="table-wrap" style="margin-top:26px">
    <table class="data-table">
      <thead><tr><th>Nome</th><th>Descrição</th><th>Tipo</th><th>Palavras-chave</th><th>Ativa</th><th></th></tr></thead>
      <tbody>
      {% for c in categorias %}
        <tr>
          <form method="post" action="{{ url_for('config.salvar_categoria', cat_id=c.id) }}" style="display:contents">
            <td><input name="nome" value="{{ c.nome }}" style="width:130px;padding:5px;border:1px solid transparent;border-radius:6px" onfocus="this.style.borderColor='var(--line)'"></td>
            <td><input name="descricao" value="{{ c.descricao or '' }}" style="width:180px;padding:5px;border:1px solid transparent;border-radius:6px" onfocus="this.style.borderColor='var(--line)'"></td>
            <td><select name="tipo" style="padding:5px;border:1px solid var(--line);border-radius:6px">
              <option value="despesa" {{ 'selected' if c.tipo=='despesa' }}>Despesa</option>
              <option value="receita" {{ 'selected' if c.tipo=='receita' }}>Receita</option>
              <option value="ambos" {{ 'selected' if c.tipo=='ambos' }}>Ambos</option>
            </select></td>
            <td><input name="palavras_chave" value="{{ c.palavras_chave or '' }}" style="width:150px;padding:5px;border:1px solid transparent;border-radius:6px" onfocus="this.style.borderColor='var(--line)'"></td>
            <td style="text-align:center"><input type="checkbox" name="ativa" {{ 'checked' if c.ativa }}></td>
            <td><button class="btn btn-ghost" style="padding:4px 10px;font-size:11px">Salvar</button></td>
          </form>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
