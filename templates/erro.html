<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3E007B">
<title>{{ titulo }} · HUB-J FLUX</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F2FB;font-family:Inter,Arial,sans-serif;color:#2A2438}
  .caixa{max-width:420px;margin:24px;padding:32px 26px;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(62,0,123,.12);text-align:center}
  .codigo{font-size:44px;font-weight:800;color:#3E007B;margin:0}
  h1{font-size:19px;margin:8px 0 10px}
  p{font-size:14.5px;line-height:1.5;color:#5b5370;margin:0 0 18px}
  a{display:inline-block;background:#FF751F;color:#fff;text-decoration:none;font-weight:700;padding:11px 22px;border-radius:999px}
</style>
</head>
<body>
  <div class="caixa">
    <p class="codigo">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p>{{ texto }}</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
